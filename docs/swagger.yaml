basePath: /api
definitions:
  campaign.CampaignRequest:
    properties:
      campaign:
        type: string
      category_id:
        type: integer
      description:
        type: string
      is_active:
        type: boolean
      min_amount:
        type: integer
      target_amount:
        type: integer
