    - title
    type: object
  category.CategoryRequest:
    properties:
      category:
        type: string
      is_active:
        type: boolean
    type: object
  donor.DonorRequest:
    properties:
      donor:
        type: string
      email:
        type: string
      gender:
        type: string
      phone:
        type: string
    type: object
  transaction.TransactionRequest:
    properties:
      amount:
        type: integer
      campaign_id:
        type: integer
      donor:
        type: string
      email:
        type: string
      gender:
        type: string
      is_anonymous:
        type: boolean
      payment_method:
        type: string
      phone:
        type: string
      prayer:
        type: string
    type: object
  user.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  user.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
